# Build the data and publish the site to GitHub Pages. Free for public repos.
#
#  * Weekly (and on demand): download Cricsheet, rebuild every bundle, refresh ICC rankings,
#    and store the result as ONE release asset (data-latest/site-data.tar.gz) instead of
#    committing ~100 MB of generated files to git every week.
#  * Every push that touches web/: redeploy the site with the latest data asset, so code
#    changes go live without a rebuild.
#  * Render and local checkouts get the same data with: python scripts/fetch_data.py
name: Build data & deploy site

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC (Cricsheet updates ~weekly)
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild data from Cricsheet first (off = just redeploy the latest data)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/site.yml"]

permissions:
  contents: write   # upload the data release asset
  issues: write     # open an issue when the weekly build fails
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install orjson numpy

      - name: Start from the previous data (keeps last week's rankings if the ICC scrape fails)
        run: |
          if gh release download data-latest -p site-data.tar.gz -D /tmp; then
            tar -xzf /tmp/site-data.tar.gz -C web/dashboard
          else
            echo "No previous data release yet."
          fi

      - name: Download latest Cricsheet corpus
        run: |
          # Cricsheet (behind Cloudflare) sometimes answers with a 200 OK challenge page instead
          # of the zip, so validate the content (PK magic + size) and retry.
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: downloading all_json.zip..."
            curl -fsSL \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -H "Accept: */*" -H "Referer: https://cricsheet.org/downloads/" \
              -o all_json.zip.tmp https://cricsheet.org/downloads/all_json.zip || {
                echo "curl failed on attempt $attempt"; sleep $((attempt * 10)); continue; }
            size=$(stat -c%s all_json.zip.tmp 2>/dev/null || echo 0)
            magic=$(head -c2 all_json.zip.tmp 2>/dev/null || echo "")
            if [ "$magic" = "PK" ] && [ "$size" -gt 10000000 ]; then
              mv all_json.zip.tmp all_json.zip; echo "Downloaded valid zip ($size bytes)."; ok=1; break
            fi
            echo "Invalid or truncated zip (size=$size, magic=$magic). Retrying..."
            rm -f all_json.zip.tmp; sleep $((attempt * 10))
          done
          [ "$ok" -eq 1 ] || { echo "::error::Could not download a valid all_json.zip from Cricsheet."; exit 1; }

      - name: Build (ingest -> SQLite -> bundles -> verify)
        run: python scripts/build_all.py --zip all_json.zip

      - name: Cross-check all data files (blocks publishing on any inconsistency)
        run: python tests/data_consistency.py

      - name: Refresh ICC rankings
        id: rankings
        continue-on-error: true   # a markup change at icc-cricket.com shouldn't block the data
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/fetch_icc_rankings.py --debug
      - name: Upload rendered HTML of failed ranking pages
        if: steps.rankings.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: icc-debug-html
          path: scripts/_debug_*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish data as the data-latest release asset
        run: |
          tar -czf site-data.tar.gz -C web/dashboard index.js rankings.js players.js winprob.js cohorts careers
          ls -lh site-data.tar.gz
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest \
            --title "Site data (latest build)" --latest=false \
            --notes "Generated by the weekly build. Fetch it with: python scripts/fetch_data.py"
          gh release upload data-latest site-data.tar.gz --clobber

  deploy:
    needs: data
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Check setup (Pages enabled + data published)
        id: ready
        run: |
          ok=true
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1 || {
            echo "::warning::GitHub Pages isn't enabled yet: Settings > Pages > Source: GitHub Actions."; ok=false; }
          gh release download data-latest -p site-data.tar.gz -D /tmp 2>/dev/null || {
            echo "::warning::No data yet: run this workflow once with 'Rebuild data' ticked."; ok=false; }
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          # a code push before first-time setup just skips; a manual run should fail loudly
          if [ "$ok" != true ] && [ "${{ github.event_name }}" != push ]; then exit 1; fi
      - name: Add the latest data
        if: steps.ready.outputs.ok == 'true'
        run: tar -xzf /tmp/site-data.tar.gz -C web/dashboard
      - name: Site config
        if: steps.ready.outputs.ok == 'true'
        env:
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}   # Settings > Variables: your Render URL (optional)
        run: |
          python -c "import json,os; print('window.CIL_API = %s;' % json.dumps(os.environ.get('LIVE_API_URL','').strip()))" > web/dashboard/config.js
          cp web/landing.html web/index.html
          touch web/.nojekyll
      - uses: actions/configure-pages@v6
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          path: web
          include-hidden-files: true   # keep .nojekyll
      - id: deployment
        if: steps.ready.outputs.ok == 'true'
        continue-on-error: true   # Pages refuses while the previous deployment is still finishing
        uses: actions/deploy-pages@v5
      - name: Wait for the previous Pages deployment to finish
        if: steps.ready.outputs.ok == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.ready.outputs.ok == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # A failed weekly build leaves the site on last week's data without anyone noticing, so open
  # (or add to) one tracking issue. GitHub emails the repo owner about new issues and comments.
  notify:
    needs: [data, deploy]
    if: always() && (needs.data.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the build-failure issue
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The ${{ github.event_name }} run on $(date -u +%Y-%m-%d) failed (data: ${{ needs.data.result }}, deploy: ${{ needs.deploy.result }}). The site keeps serving the last good data until a run succeeds. Log: $run_url"
          title="Weekly data build failed"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"
          else gh issue create --title "$title" --body "$body"; fi

  # Close the tracking issue once a rebuild goes through again.
  recovered:
    needs: [data, deploy]
    if: needs.data.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Close the build-failure issue
        run: |
          for num in $(gh issue list --state open --search '"Weekly data build failed" in:title' --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Fixed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} rebuilt and deployed the data."
          done
