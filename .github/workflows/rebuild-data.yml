# #3 — Auto-rebuild the whole dataset from the latest Cricsheet corpus, on a schedule.
# Downloads all_json.zip, runs build_all.py (which self-verifies), commits the refreshed
# cohort bundles + careers.js. Free on GitHub Actions for public repos.
name: Rebuild data from Cricsheet

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC (Cricsheet updates ~weekly)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install orjson numpy
      - name: Download latest Cricsheet corpus
        run: |
          # curl's own --retry only kicks in on transient/HTTP errors. Cricsheet (behind
          # Cloudflare) occasionally answers a normal GET with a 200 OK bot-challenge or
          # error HTML page instead of the zip, which curl -f happily accepts — that's
          # what turned into "BadZipFile: File is not a zip file" downstream. So we
          # download into a temp file and validate the *content* (PK magic + min size)
          # ourselves, retrying the whole request a few times before giving up loudly.
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: downloading all_json.zip..."
            curl -fsSL \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -H "Accept: */*" \
              -H "Accept-Encoding: gzip, deflate, br" \
              -H "Referer: https://cricsheet.org/downloads/" \
              -o all_json.zip.tmp https://cricsheet.org/downloads/all_json.zip || {
                echo "curl failed on attempt $attempt"; sleep $((attempt * 10)); continue;
              }

            size=$(stat -c%s all_json.zip.tmp 2>/dev/null || echo 0)
            magic=$(head -c2 all_json.zip.tmp 2>/dev/null || echo "")
            if [ "$magic" = "PK" ] && [ "$size" -gt 10000000 ]; then
              mv all_json.zip.tmp all_json.zip
              echo "Downloaded valid zip ($size bytes)."
              ok=1
              break
            fi

            echo "Attempt $attempt produced an invalid or truncated zip (size=$size bytes, magic=$magic). Retrying..."
            head -c 500 all_json.zip.tmp 2>/dev/null || true
            rm -f all_json.zip.tmp
            sleep $((attempt * 10))
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Failed to download a valid all_json.zip from Cricsheet after 5 attempts."
            exit 1
          fi
      - name: Build (ingest -> SQLite -> bundles -> verify)
        run: python build_all.py --zip all_json.zip
      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A    # all_json.zip + cil.db are gitignored, so only the bundles get staged
          git diff --cached --quiet || git commit -m "Auto-rebuild from latest Cricsheet data"
          git push
